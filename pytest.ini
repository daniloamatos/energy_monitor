[pytest]
testpaths = tests/unit tests/integration tests/gui
pythonpath = src tests
addopts = -ra --strict-markers
markers =
    unit: Regras puras, cálculos e apresentação sem widgets.
    integration: Arquivos, SQLite, rede simulada, CLI e processos reais isolados.
    gui: Widgets Tk; requer display virtual ou sessão gráfica explicitamente habilitada.
    slow: Ensaios de volume real ou execução custosa, fora do ciclo rápido.
